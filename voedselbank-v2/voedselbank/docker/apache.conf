# Apache-configuratie voor de container.
#   /api/...  gaat naar de PHP front controller (backend/public/index.php)
#   al het andere is de Vue-app; onbekende paden krijgen index.html,
#   zodat de Vue-router de pagina kan tonen (bijv. /klanten na verversen).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    Alias /api /var/www/backend/public/index.php
    <Directory /var/www/backend/public>
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # de backend-code zelf is nooit rechtstreeks op te vragen
    <Directory /var/www/backend>
        Require all denied
    </Directory>
    <Directory /var/www/backend/public>
        Require all granted
    </Directory>

    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
