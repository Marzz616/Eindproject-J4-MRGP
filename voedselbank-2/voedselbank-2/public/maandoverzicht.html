<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maandoverzichten · Voedselbank Maaskantje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .printkop { display: none; }
  @media print {
    .printkop { display: block; margin-bottom: 14px; }
    .printkop h1 { font-size: 20px; }
    .printkop .onder { color: #555; font-size: 12px; }
    table.lijst tbody td { height: auto; padding: 7px 10px; font-size: 12px; }
    table.lijst thead th { height: auto; padding: 7px 10px; }
    .card { border: 0; }
    .card > .kop { padding: 0 0 8px; }
    @page { size: A4 landscape; margin: 14mm; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="assets/app.js"></script>
<script>
const MAANDEN_VOL = ['januari', 'februari', 'maart', 'april', 'mei', 'juni',
                     'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
let soort = 'categorie';
let maand = new Date().getMonth() + 1;
let jaar  = new Date().getFullYear();

(async function () {
  const ik = await start({
    slug: 'rapportages',
    titel: 'Maandoverzichten',
    onder: 'De twee vaste maandrapportages uit de casus, te filteren en af te drukken',
  });
  if (!ik) { return; }
  await laden();
})();

async function laden() {
  const bak = document.getElementById('inhoud');
  bak.innerHTML = balk() + '<div class="skelet">Bezig met laden…</div>';
  koppel();

  let d;
  try { d = await api(`rapportages.php?actie=maand&soort=${soort}&maand=${maand}&jaar=${jaar}`); }
  catch (e) { foutMelden(e); return; }

  bak.innerHTML = balk() + printkop() +
    (soort === 'categorie' ? tabelCategorie(d) : tabelPostcode(d));
  koppel();
}

function balk() {
  const jaren = [];
  for (let j = new Date().getFullYear(); j >= new Date().getFullYear() - 4; j--) { jaren.push(j); }

  return `
    <div class="zoekbalk nietprint">
      <div class="chips" style="flex:1">
        <button class="chip ${soort === 'categorie' ? 'aan' : ''}" data-soort="categorie">Per productcategorie</button>
        <button class="chip ${soort === 'postcode' ? 'aan' : ''}" data-soort="postcode">Per postcode</button>
      </div>
      <select id="maand" style="height:42px;border:1px solid var(--line-2);border-radius:9px;padding:0 12px;font:inherit;background:#fff">
        ${MAANDEN_VOL.map((m, i) => `<option value="${i + 1}"${maand === i + 1 ? ' selected' : ''}>${m}</option>`).join('')}
      </select>
      <select id="jaar" style="height:42px;border:1px solid var(--line-2);border-radius:9px;padding:0 12px;font:inherit;background:#fff">
        ${jaren.map(j => `<option value="${j}"${jaar === j ? ' selected' : ''}>${j}</option>`).join('')}
      </select>
      <a class="knop" href="rapportages.html">← Rapportages</a>
      <button class="knop primair" id="print">Afdrukken</button>
    </div>`;
}

function printkop() {
  return `
    <div class="printkop">
      <h1>Voedselbank Maaskantje — maandoverzicht ${soort === 'categorie' ? 'per productcategorie' : 'per postcode'}</h1>
      <div class="onder">${MAANDEN_VOL[maand - 1]} ${jaar} · afgedrukt op ${datumKort(new Date().toISOString().slice(0, 10))}</div>
    </div>`;
}

function koppel() {
  document.querySelectorAll('[data-soort]').forEach(b => b.onclick = () => { soort = b.dataset.soort; laden(); });
  const m = document.getElementById('maand');
  if (m) { m.onchange = (e) => { maand = Number(e.target.value); laden(); }; }
  const j = document.getElementById('jaar');
  if (j) { j.onchange = (e) => { jaar = Number(e.target.value); laden(); }; }
  const p = document.getElementById('print');
  if (p) { p.onclick = () => window.print(); }
}

/* ---------------- RAP-1: per productcategorie ---------------- */
function tabelCategorie(d) {
  if (!d.rijen.length) {
    return leegKaart(d);
  }

  let vorige = null;
  const rijen = d.rijen.map(r => {
    const kop = r.categorie !== vorige
      ? `<tr><td colspan="5" style="height:44px;background:var(--row-alt);font-weight:700;font-size:13px">${esc(r.categorie)}</td></tr>`
      : '';
    vorige = r.categorie;
    return kop + `<tr>
      <td style="padding-left:34px" class="sterk">${esc(r.product)}</td>
      <td>${esc(r.leverancier)}</td>
      <td class="r mono">${getal(r.geleverd)}</td>
      <td class="r mono zacht">${getal(r.uitgegeven)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <div class="kop">
        <h2>Per productcategorie — ${MAANDEN_VOL[d.maand - 1]} ${d.jaar}</h2>
        <span class="tel rechts">${getal(d.totaal)} stuks binnengekomen</span>
      </div>
      <table class="lijst">
        <thead><tr>
          <th>Product</th><th>Leverancier</th>
          <th class="r">Geleverd deze maand</th><th class="r">Uitgegeven deze maand</th>
        </tr></thead>
        <tbody>${rijen}</tbody>
      </table>
    </div>`;
}

/* ---------------- RAP-2: per postcode ---------------- */
function tabelPostcode(d) {
  if (!d.rijen.length) {
    return leegKaart(d);
  }

  const cats = d.categorieen;
  const totaalAlles = d.rijen.reduce((s, r) => s + r.totaal, 0);

  return `
    <div class="card">
      <div class="kop">
        <h2>Per postcode — ${MAANDEN_VOL[d.maand - 1]} ${d.jaar}</h2>
        <span class="tel rechts">${getal(totaalAlles)} stuks uitgegeven</span>
      </div>
      <table class="lijst">
        <thead><tr>
          <th>Postcode</th><th class="r">Gezinnen</th><th class="r">Pakketten</th>
          ${cats.map(c => `<th class="r" style="font-size:10.5px">${esc(c)}</th>`).join('')}
          <th class="r">Totaal</th>
        </tr></thead>
        <tbody>${d.rijen.map(r => `<tr>
          <td class="sterk mono">${esc(r.postcode)}</td>
          <td class="r mono zacht">${r.gezinnen}</td>
          <td class="r mono zacht">${r.pakketten}</td>
          ${cats.map(c => `<td class="r mono">${r.per[c] ? getal(r.per[c]) : '<span class="zacht">—</span>'}</td>`).join('')}
          <td class="r mono sterk">${getal(r.totaal)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function leegKaart(d) {
  return `<div class="card"><div class="leeg">
    <h3>Geen gegevens in ${MAANDEN_VOL[d.maand - 1]} ${d.jaar}</h3>
    <div>Kies een andere maand of een ander jaar.</div>
  </div></div>`;
}
</script>
</body>
</html>
